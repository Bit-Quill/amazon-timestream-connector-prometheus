services:
  timestream-prometheus-connector:
    container_name: connector
    build: .
    ports:
      - "9201:9201"
    volumes:
      - .:/home
    command:
      - --default-database=${DEFAULT_DATABASE:-DevPrometheusDatabase}
      - --default-table=${DEFAULT_TABLE:-DevPrometheusMetricsTable}
      - --region=${AWS_REGION:-us-west-2}
      - --log.level=debug
